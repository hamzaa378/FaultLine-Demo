name: Faultline - simulated deployment telemetry

# Demo only: creates GitHub deployment API objects, not a real deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      outcome:
        description: "Choose the simulated deployment outcome"
        required: true
        default: success
        type: choice
        options:
          - success
          - failure

permissions:
  contents: read
  deployments: write

concurrency:
  group: faultline-demo-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulated-deployment:
    name: Emit signed GitHub deployment telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create deployment and publish simulated status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const outcome = context.eventName === 'workflow_dispatch'
              ? (context.payload.inputs?.outcome || 'success')
              : 'success';
            if (!['success', 'failure'].includes(outcome)) {
              throw new Error(`Unsupported simulated outcome: ${outcome}`);
            }

            // No infrastructure is deployed. This is a telemetry-only exercise.
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              auto_merge: false,
              required_contexts: [],
              environment: 'faultline-demo-simulated',
              production_environment: false,
              transient_environment: true,
              description: 'SIMULATED deployment for Faultline verification; no code deployed',
              payload: {
                service: 'checkout-api',
                simulated: true,
                workflow_run_id: context.runId,
              },
            });
            core.info(`Created simulated deployment ID: ${deployment.id}`);

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              description: 'SIMULATION in progress; no infrastructure changes',
              auto_inactive: false,
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: outcome,
              description: outcome === 'success'
                ? 'SIMULATED success; no code was deployed'
                : 'SIMULATED failure requested for testing; no code was deployed',
              auto_inactive: false,
            });
            core.notice(`Simulated deployment ${deployment.id}: ${outcome}`);
